<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#147D74">
<title>ClinicAI — No-show & Recall Assistant (Prototype)</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap");
:root{
  /* Calm Teal — shared semantic tokens (single source of truth; no raw hex below this block) */
  --primary:#147D74; --primary-hover:#10665F; --primary-soft:#E8F4F1; --primary-line:#C9E5DC;
  --canvas:#F7FAF9; --surface:#FFFFFF; --subtle:#F1F6F4;
  --ink:#203B36; --secondary:#526B63;
  --muted:#5A6E66;          /* palette suggested #6B7F77 (3.7–4.3:1); darkened to pass WCAG AA (≥4.7:1 on every surface) */
  --line:#DCE7E2;           /* decorative dividers and card borders */
  --line-strong:#7D948B;    /* form-control / toggle boundaries (≥3:1 non-text contrast) */
  --focus:#53B5A7;
  --success:#237449; --success-soft:#EAF5EE;
  --warning:#936018; --warning-soft:#FFF4DF; --warning-line:#EBD3A3;
  --danger:#B54747;  --danger-soft:#FDECEC;
  --info:#356B93;    --info-soft:#EAF3FA; --info-line:#C5DCEC;
  --danger-line:#E6BDBD; --accent-on-dark:#A7E3D8; --scrim:rgb(32 59 54 / 55%);
  /* message categories (not statuses) */
  --cat-noshow:#925B22; --cat-noshow-soft:#FFF1E3;
  --cat-recall:#70549A; --cat-recall-soft:#F1ECF8;
  --cat-reminder:#356B93; --cat-reminder-soft:#EAF3FA;
  /* chat */
  --thread:#F4F8F5; --out:#E2F2EA;
  --font-sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Gujarati",Arial,sans-serif;
  --font-heading:"Manrope","DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --radius-card:16px; --radius-control:10px;
  --shadow:0 2px 8px rgb(32 59 54 / 4%);
  --safe-b:env(safe-area-inset-bottom,0px);
  --tabs-h:62px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font-sans);background:var(--canvas);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand,.hero .big,.kpi .v{font-family:var(--font-heading)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--primary);font-weight:600}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:200}
.skip:focus{left:8px}

/* ---------- shell ---------- */
.demo-banner{background:var(--ink);color:#fff;text-align:center;font-size:12.5px;font-weight:600;padding:7px 12px;line-height:1.3}
.demo-banner b{background:var(--warning-soft);color:var(--warning);border-radius:4px;padding:1px 6px;margin-right:6px}
.side{display:none}
.main{padding:14px 14px calc(var(--tabs-h) + 28px + var(--safe-b));max-width:1100px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:var(--safe-b)}
.tabs a,.side a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;min-height:var(--tabs-h);font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;justify-content:center}
.tabs a[aria-current=page]{color:var(--primary)}
.tabs a[aria-current=page]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--primary);border-radius:0 0 4px 4px}
.badge{background:var(--danger);color:#fff;font-size:12px;font-weight:700;border-radius:99px;min-width:18px;padding:0 5px;text-align:center;line-height:18px;height:18px}
.badge[hidden]{display:none}
.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px)}
body.thread-open .tabs{display:none}
body.chat-view .main{padding-left:0;padding-right:0;padding-top:0}
body.thread-open .main{padding:0}
.brand{display:none}
@media(min-width:900px){
  body{padding:16px}
  .demo-banner{border-radius:12px;margin-bottom:12px}
  .app{display:grid;grid-template-columns:236px 1fr;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);min-height:calc(100vh - 96px);max-width:1440px;margin:0 auto;overflow:clip}
  .tabs{display:none}
  .side{display:flex;flex-direction:column;position:sticky;top:16px;height:calc(100vh - 96px);padding:18px 14px;border-right:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;padding:2px 8px 18px}
  .logo{width:32px;height:32px;border-radius:10px;background:var(--primary);display:grid;place-items:center;color:#fff}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side a{flex-direction:row;justify-content:flex-start;gap:10px;min-height:44px;padding:0 12px;border-radius:12px;font-size:14.5px}
  .side a:hover{background:var(--subtle)}
  .side a[aria-current=page]:hover{background:var(--primary-hover)}
  .side a[aria-current=page]{background:var(--primary);color:#fff}
  .side a[aria-current=page] .badge{background:#fff;color:var(--danger)}
  .side .badge{margin-left:auto}
  .side-foot{margin-top:auto;background:var(--primary-soft);border:1px solid var(--primary-line);border-radius:14px;padding:14px;font-size:12.5px;color:var(--primary-hover)}
  .side-foot b{display:block;margin-bottom:2px;font-size:13px}
  .main{padding:26px 30px 40px;background:var(--canvas);max-width:none;margin:0;min-width:0}
  body.chat-view .main,body.thread-open .main{padding:0;background:var(--surface)}
}
.view{display:none}
.view.on{display:block}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.page-head h1{font-size:clamp(26px,4vw,34px);font-weight:800;letter-spacing:-.03em;line-height:1.25}
.page-head .sub{color:var(--muted);font-size:14px;margin-top:3px;max-width:62ch}

/* ---------- common ---------- */
.card,.kpi,.dcard,.empty,.dsk,.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--shadow)}
.card{padding:20px 16px}
.card h2{font-size:16px;font-weight:700;margin-bottom:2px}
.card .h-sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:var(--radius-control);font-weight:700;font-size:14.5px;border:1.5px solid transparent;transition:transform .1s,background .15s;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.pri{background:var(--primary);color:#fff}
.btn.pri:hover:not([disabled]){background:var(--primary-hover)}
.btn.sec{background:var(--surface);color:var(--secondary);border-color:var(--line-strong)}
.btn.sec:hover:not([disabled]){background:var(--primary-soft)}
.btn.dng{background:var(--surface);color:var(--danger);border-color:var(--danger-line)}
.btn.dng:hover{background:var(--danger-soft)}
.btn.dng-s{background:var(--danger);color:#fff}
.btn.ghost{color:var(--muted)}
.btn.ghost:hover{background:var(--canvas)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip svg.i{width:13px;height:13px}
.c-noshow{background:var(--cat-noshow-soft);color:var(--cat-noshow)}
.c-recall{background:var(--cat-recall-soft);color:var(--cat-recall)}
.c-reminder{background:var(--cat-reminder-soft);color:var(--cat-reminder)}
.c-ok{background:var(--success-soft);color:var(--success)}
.c-info{background:var(--info-soft);color:var(--info)}
.c-warn{background:var(--warning-soft);color:var(--warning)}
.c-bad{background:var(--danger-soft);color:var(--danger)}
.c-neutral{background:var(--subtle);color:var(--secondary);box-shadow:inset 0 0 0 1px var(--line)}
.sample{display:inline-flex;align-items:center;background:var(--warning-soft);color:var(--warning);border:1px dashed var(--warning);border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700;vertical-align:middle}
.avatar{width:42px;height:42px;border-radius:13px;background:var(--primary-soft);color:var(--primary-hover);font-weight:800;display:grid;place-items:center;flex:none;font-size:14px;border:1px solid var(--primary-line)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label,.lbl{font-size:13.5px;font-weight:700;color:var(--ink)}
.field .help{font-size:12.5px;color:var(--muted)}
.field .err{font-size:12.5px;color:var(--danger);font-weight:600;display:none}
.field.bad .err{display:block}
.field.bad input{border-color:var(--danger)}
input[type=text],input[type=email],input[type=tel],input[type=search],input[type=time],select,textarea{width:100%;min-height:46px;border:1.5px solid var(--line-strong);border-radius:var(--radius-control);padding:10px 12px;background:var(--surface);font-size:16px}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:3px solid var(--focus);border-color:var(--primary)}
.search-box{position:relative}
.search-box svg.i{position:absolute;left:13px;top:14px;color:var(--muted)}
.search-box input{padding-left:40px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.mut{color:var(--muted)}

/* dialog + toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.dlg{background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + var(--safe-b));max-height:92vh;overflow:auto;animation:up .22s ease}
.dlg h2{font-size:18px;margin-bottom:6px}
.dlg p{color:var(--secondary);font-size:14.5px;margin-bottom:12px}
.dlg .row{display:flex;gap:8px;margin-top:14px}
.dlg .row .btn{flex:1}
@media(min-width:600px){.scrim{align-items:center}.dlg{border-radius:22px}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
#toasts{position:fixed;left:50%;bottom:calc(var(--tabs-h) + 14px + var(--safe-b));transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;width:calc(100% - 24px);max-width:460px;pointer-events:none}
body.thread-open #toasts{bottom:calc(84px + var(--safe-b))}
@media(min-width:900px){#toasts{bottom:24px}}
.toast{pointer-events:auto;background:var(--ink);color:#fff;padding:10px 10px 10px 14px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;animation:up .25s ease}
.toast span{flex:1}
.toast button{color:var(--accent-on-dark);font-weight:800;min-height:40px;padding:0 14px;border-radius:10px;font-size:14px}
.toast button:hover{background:rgba(255,255,255,.1)}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--line) 25%,var(--canvas) 37%,var(--line) 63%);background-size:400% 100%;animation:sk 1.3s infinite;border-radius:8px}
@keyframes sk{from{background-position:100% 0}to{background-position:0 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- inbox ---------- */
.notice{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 13px;font-size:13.5px;margin-bottom:10px}
.notice svg.i{margin-top:2px}
.notice.teal{background:var(--primary-soft);border:1px solid var(--primary-line);color:var(--primary-hover)}
.notice.amber{background:var(--warning-soft);border:1px solid var(--warning-line);color:var(--warning)}
.notice.blue{background:var(--info-soft);border:1px solid var(--info-line);color:var(--info)}
.notice a{color:inherit;text-decoration:underline}
.sticky-ctl{position:sticky;top:0;z-index:20;background:var(--canvas);margin:0 -14px 12px;padding:6px 14px 8px}
@media(min-width:900px){.sticky-ctl{background:var(--canvas);margin:0 -30px 12px;padding:6px 30px 8px}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--subtle);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{min-height:44px;border-radius:10px;font-weight:700;font-size:14px;color:var(--secondary);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-selected=true]{background:var(--surface);color:var(--primary-hover);box-shadow:0 0 0 1px var(--primary),0 1px 3px rgb(32 59 54 / 10%)}
.seg .n{background:var(--line);color:var(--ink);border-radius:99px;font-size:12px;min-width:22px;padding:0 6px;line-height:20px}
.seg button[aria-selected=true] .n{background:var(--primary-soft);color:var(--primary-hover)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14px;color:var(--secondary);display:inline-flex;align-items:center;gap:6px}
.fchip[aria-pressed=true]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-hover);box-shadow:inset 0 0 0 1px var(--primary)}
.inbox{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:1100px){.inbox{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.dcard{overflow:hidden;transition:opacity .28s,transform .28s}
.dcard.leaving{opacity:0;transform:translateX(30px)}
.dcard.flagged{box-shadow:0 0 0 2px var(--warning),var(--shadow)}
.d-top{padding:14px 16px 0;display:flex;gap:12px;align-items:flex-start}
.d-top .who{flex:1;min-width:0}
.d-top .nm{font-weight:800;font-size:16.5px;line-height:1.25}
.d-top .ctx{font-size:13.5px;color:var(--muted);margin-top:2px}
.d-meta{padding:10px 16px 0;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13.5px}
.rev{color:var(--success);font-weight:800}
.d-msg{padding:12px 16px 4px}
.d-msg .cap{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--primary-hover);display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.d-msg .cap .tagx{background:var(--subtle);color:var(--secondary);box-shadow:inset 0 0 0 1px var(--line);border-radius:6px;padding:0 6px;text-transform:none;letter-spacing:0}
.bubble{background:var(--subtle);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:16.5px;line-height:1.55;white-space:pre-wrap;color:var(--ink);word-break:break-word}
.bubble.edited{border-color:var(--primary)}
.flag{margin:10px 16px 0;background:var(--warning-soft);border:1px solid var(--warning-line);color:var(--warning);border-radius:12px;padding:9px 12px;font-size:13.5px;display:flex;gap:8px}
.flag svg.i{margin-top:2px;color:var(--warning)}
.d-edit{padding:12px 16px 4px}
.d-edit textarea{min-height:150px;font-size:16.5px;margin-top:5px}
.d-edit .cnt{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.d-acts{padding:12px 16px 14px;display:grid;gap:8px}
.d-acts .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.d-acts .btn.pri{min-height:52px;font-size:16px}
.d-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 12px;padding:0 16px 14px;font-size:13.5px}
.d-foot a{display:inline-flex;align-items:center;gap:5px;min-height:36px}
.state-line{padding:10px 16px 14px;font-size:13.5px;color:var(--secondary);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.empty{text-align:center;padding:40px 24px}
.empty .ic{width:60px;height:60px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin:0 auto 12px}
.empty .ic svg.i{width:28px;height:28px}
.empty h2{font-size:19px;margin-bottom:4px}
.empty p{color:var(--muted);max-width:42ch;margin:0 auto 14px}
.empty .btn{margin:3px}
.dsk{padding:16px;display:grid;gap:12px}

/* ---------- dashboard ---------- */
.rangeseg{display:inline-grid;grid-auto-flow:column;background:var(--subtle);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.rangeseg button{min-height:40px;padding:0 14px;border-radius:9px;font-weight:700;font-size:14px;color:var(--secondary)}
.rangeseg button[aria-pressed=true]{background:var(--surface);color:var(--primary-hover);box-shadow:0 0 0 1px var(--primary)}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%}
@media(min-width:700px){.head-actions{width:auto}}
.hero{border-top:4px solid var(--primary);padding:20px 16px;color:var(--ink)}
.hero .k{font-size:14px;font-weight:700;color:var(--secondary);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin:6px 0}
.hero .cmp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--secondary)}
.hero .def{font-size:14px;margin-top:10px;max-width:60ch;color:var(--secondary)}
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px;border-radius:99px;padding:2px 9px;background:var(--success-soft);color:var(--success)}
.delta.down{background:var(--danger-soft);color:var(--danger)}
.delta svg.i{width:12px;height:12px;stroke-width:3}
.cta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--warning-soft);border:1px solid var(--warning-line);border-radius:var(--radius-card);padding:16px}
.cta.clear{background:var(--primary-soft);border-color:var(--primary-line)}
.cta b{font-size:15.5px;display:block}
.cta .s{font-size:13.5px;color:var(--secondary)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:16px}
.kpi .l{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .l svg.i{color:var(--primary);width:16px;height:16px}
.kpi .v{font-size:27px;font-weight:800;letter-spacing:-.5px;margin:4px 0 2px}
.kpi .d{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}
.kpi .prev{font-size:12.5px;color:var(--muted);margin-top:4px}
.dash-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media(min-width:1000px){.dash-grid.two{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--secondary);margin:6px 0 6px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--primary);vertical-align:middle;margin-right:6px;border-radius:2px}
.legend i.p{border-top:2px dashed var(--line-strong)}
#chartBox{touch-action:pan-y}
#chartBox svg{display:block;overflow:visible}
.readout{background:var(--canvas);border-radius:12px;padding:8px 12px;font-size:13.5px;min-height:40px;display:flex;justify-content:space-between;gap:2px 10px;flex-wrap:wrap;margin-bottom:8px}
.readout b{color:var(--primary-hover)}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.split div{border-top:4px solid;padding-top:6px;font-size:12.5px;color:var(--muted);line-height:1.3}
.split b{display:block;color:var(--ink);font-size:15px}
.appt{list-style:none}
.appt li{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.appt li:first-child{border-top:0}
.appt .tm{width:62px;font-weight:800;font-size:13.5px;flex:none}
.appt .pn{flex:1;min-width:0}
.appt .pn b{display:block;font-size:15px}
.appt .pn span{font-size:13px;color:var(--muted)}
.sumrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.wins{list-style:none}
.wins li{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.wins li:first-child{border-top:0}
.wins .t{flex:1;min-width:0}
.wins .t b{display:block}
.wins .t span{font-size:13.5px;color:var(--muted)}
.wins .amt{font-weight:800;color:var(--success);white-space:nowrap}

function toast(msg, opts = {}) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>${opts.action ? `<button type="button">${esc(opts.action)}</button>` : ''}`;
  if (opts.action) $('button', t).onclick = () => { opts.onAction?.(); t.remove(); };
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), opts.ms || 3500);
}
let dlgResolve = null, dlgReturn = null;
function openScrim() { dlgReturn = document.activeElement; $('#scrim').hidden = false; }
function dialog({title, body, ok = 'Confirm', cancel = 'Cancel', danger = false}) {
  return new Promise(res => {
    dlgResolve = res; openScrim();
    $('#dlg').innerHTML = `<h2 id="dlgT">${esc(title)}</h2><div>${body}</div>
      <div class="row"><button class="btn sec" data-r="0" type="button">${esc(cancel)}</button><button class="btn ${danger ? 'dng-s' : 'pri'}" data-r="1" type="button">${esc(ok)}</button></div>`;
    $$('[data-r]', $('#dlg')).forEach(b => b.onclick = () => closeDlg(b.dataset.r === '1'));
    $('[data-r="0"]', $('#dlg')).focus();
  });
}
function closeDlg(v = false) {
  $('#scrim').hidden = true; const r = dlgResolve; dlgResolve = null; r?.(v);
  if (dlgReturn?.isConnected) dlgReturn.focus();
}
$('#scrim').addEventListener('mousedown', e => { if (e.target.id === 'scrim') closeDlg(false); });
document.addEventListener('keydown', e => {
  if ($('#scrim').hidden) return;
  if (e.key === 'Escape') closeDlg(false);
  if (e.key === 'Tab') { // keep focus inside the dialog
    const f = $$('button,input,textarea,select', $('#dlg')).filter(x => !x.disabled);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { f.at(-1).focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === f.at(-1)) { f[0].focus(); e.preventDefault(); }
  }
});

function bindInbox(v) {
  $$('[data-tab]', v).forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.editing = null; renderInbox(); $(`[data-tab="${S.tab}"]`).focus(); });
  $$('[data-f]', v).forEach(b => b.onclick = () => { const k = b.dataset.f; S.filters.has(k) ? S.filters.delete(k) : S.filters.add(k); renderInbox(); $(`[data-f="${k}"]`)?.focus(); });
  const clear = () => { S.filters.clear(); S.q = ''; renderInbox(); };
  $('#clearF', v)?.addEventListener('click', clear); $('#clearF2', v)?.addEventListener('click', clear);
  $('#resetDemo', v)?.addEventListener('click', resetDrafts);
  const si = $('#inSearch', v);
  si.oninput = () => { S.q = si.value; const pos = si.selectionStart; renderInbox(); const n = $('#inSearch'); n.focus(); n.setSelectionRange(pos, pos); };
  $$('[data-approve]', v).forEach(b => b.onclick = () => approve(b.dataset.approve));
  $$('[data-reject]', v).forEach(b => b.onclick = () => reject(b.dataset.reject));
  $$('[data-edit]', v).forEach(b => b.onclick = () => { S.editing = b.dataset.edit; renderInbox(); const t = $('#ta-' + S.editing); t.focus(); t.setSelectionRange(t.value.length, t.value.length); });
  $$('[data-cancel]', v).forEach(b => b.onclick = () => { S.editing = null; renderInbox(); });
  $$('[data-save]', v).forEach(b => b.onclick = () => {
    const d = DRAFTS.find(x => x.id === b.dataset.save), t = $('#ta-' + d.id).value.trim();
    if (!t) { toast('A message can’t be empty.'); return; }
    if (t !== d.text) { d.text = t; d.edited = true; }
    d.flag = null; S.editing = null; renderInbox(); toast('Draft updated. Ready for your approval.');
  });
  $$('[data-restore]', v).forEach(b => b.onclick = () => { setStatus(b.dataset.restore, 'pending'); renderInbox(); toast('Moved back to pending.'); });
  $$('textarea[id^="ta-"]', v).forEach(t => t.oninput = () => { $('#cnt-' + t.id.slice(3)).textContent = t.value.length + '/1000'; });
}
function setStatus(id, status) {
  const d = DRAFTS.find(x => x.id === id); d.status = status;
  if (status === 'pending') { d.decidedAt = null; d.decidedBy = null; } else { d.decidedAt = new Date(); d.decidedBy = 'You'; }
}
function leaveCard(id, then) {
  const el = $('#card-' + id);
  if (!el) return then();
  if (el.classList.contains('leaving')) return;
  el.classList.add('leaving'); setTimeout(then, 280);
}
async function approve(id) {
  const d = DRAFTS.find(x => x.id === id), p = PATIENTS[d.pid];
  if (d.flag) {
    const ok = await dialog({title:'Approve with a warning?', ok:'Approve anyway', cancel:'Go back',
      body:`<p><b>${esc(p.name)}:</b> ${esc(d.flag)}</p><p>Choose “Go back”, then Edit to fix it first.</p>`});
    if (!ok) return;
  }
  leaveCard(id, () => {
    setStatus(id, 'approved'); renderInbox();
    toast(`Approved for ${p.name}. Demo send, not delivered.`, {action:'Undo', ms:8000, onAction:() => { setStatus(id, 'pending'); if (S.route.name === 'inbox') renderInbox(); else syncBadge(); toast('Approval undone. Back in pending.'); }});
  });
}
function reject(id) {
  const p = PATIENTS[DRAFTS.find(x => x.id === id).pid];
  leaveCard(id, () => {
    setStatus(id, 'rejected'); renderInbox();
    toast(`Draft for ${p.name} rejected.`, {action:'Undo', ms:8000, onAction:() => { setStatus(id, 'pending'); if (S.route.name === 'inbox') renderInbox(); else syncBadge(); toast('Rejection undone.'); }});
  });
}
function resetDrafts() {
  ['d1','d2','d3','d4','d5','d6'].forEach(i => setStatus(i, 'pending'));
  Object.assign(DRAFTS.find(d => d.id === 'd4'), {flag:FLAG_D4, text:TEXT_D4, edited:false});
  S.tab = 'pending'; renderInbox(); toast('Sample drafts restored.');
}

function deltaChip(cur, prev) {
  const p = (cur - prev) / prev * 100, up = p >= 0;
  return `<span class="delta ${up ? '' : 'down'}">${icon(up ? 'up' : 'down')}${Math.abs(p).toFixed(1)}%</span>`;
}
function series(n, total, seed) { // deterministic sample daily revenue that sums to `total`
  const raw = []; let s = seed;
  for (let i = 0; i < n; i++) { s = (s * 9301 + 49297) % 233280; raw.push(0.6 + (s / 233280) * 0.8 + (i / n) * 0.25); }
  const sum = raw.reduce((a, b) => a + b, 0);
  return raw.map(r => Math.round(r / sum * total));
}

}

function drawChart() {

    <path d="${path(prv)}" fill="none" stroke="#7D948B" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="${path(cur)} L${X(n - 1)} ${Y(0)} L${X(0)} ${Y(0)}Z" fill="#147D74" fill-opacity=".10"/>
    <path d="${path(cur)}" fill="none" stroke="#147D74" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${tx.map((i, k) => `<text x="${X(i)}" y="${H - 8}" font-size="12" fill="#5A6E66" text-anchor="${k === 0 ? 'start' : k === tx.length - 1 ? 'end' : 'middle'}">${lbl(date(i))}</text>`).join('')}
    <line id="cur" y1="${T}" y2="${H - B}" stroke="#147D74" stroke-width="1.5" opacity="0"/><circle id="dot" r="5.5" fill="#fff" stroke="#147D74" stroke-width="3" opacity="0"/>

/* Thread = delivered history + items derived from the inbox store.
   Pending drafts show as "AI draft · not sent"; approved ones as "Approved · demo only".
   Neither is ever shown with delivery ticks. */
function allMsgs(pid) {
  const out = CONVOS[pid].msgs.map(m => ({kind:'msg', ...m}));
  DRAFTS.filter(d => d.pid === pid && d.status !== 'rejected').forEach(d => out.push({kind:d.status === 'pending' ? 'draft' : 'queued', d, t:d.decidedAt || NOW}));
  return out.sort((a, b) => a.t - b.t);
}
function lastPreview(pid) {
  const items = allMsgs(pid), draft = items.some(x => x.kind === 'draft');
  const m = items.filter(x => x.kind === 'msg' || x.kind === 'sent').at(-1);
  return m ? {text:(m.w === 'out' ? 'You: ' : '') + m.b.replace(/\n+/g, ' '), t:m.t, draft} : {text:'No messages yet', t:null, draft};
}

    $('#bkOffer').onclick = () => {
      const text = `Hi ${p.name.split(' ')[0]}, we have ${label()} available for your ${p.appt.label.toLowerCase()}. Shall I book it for you?`;
      closeDlg(); const ta = $('#compText'); ta.value = text; ta.dispatchEvent(new Event('input')); ta.focus();
    };
    $('#bkBook').onclick = () => {
      const [, h, m, ap] = slots[S.sheet.slot].match(/(\d+):(\d+) (AM|PM)/); const d = new Date(days[S.sheet.day]);
      d.setHours(+h % 12 + (ap === 'PM' ? 12 : 0), +m);
      p.appt.when = d; p.appt.note = `${dfmt(d)}, ${tfmt(d)}`;
      CONVOS[id].msgs.push({kind:'sys', t:new Date(), b:`${rescheduling ? 'Rescheduled' : 'Booked'} in the demo calendar for ${dfmt(d)}, ${tfmt(d)}. No message was sent to the patient.`});
      closeDlg(); renderChat(); toast('Updated in the demo calendar.');
    };
  };
  dlgResolve = null; openScrim(); draw(); $('#dlg button')?.focus();
}

/* =====================================================================
   4. SETTINGS
   ===================================================================== */
const DEFAULTS = {
  clinic:{name:'Smile Studio Dental, Bandra', owner:'Dr. Neha Sharma', address:'Shop 4, Linking Road, Bandra West, Mumbai 400050', phone:'98200 12345', email:'hello@smilestudio.example'},
  lang:'English',
  auto:{noshow:true, recall:true, reminder:true},
  timing:{noshowDelay:'2h', recallMonths:'6', reminderLead:'24h'},
  approval:{noshow:true, recall:true, reminder:true},
  hours:{start:'09:00', end:'19:00', days:['Mon','Tue','Wed','Thu','Fri','Sat'], cap:'2'},
};
S.saved = structuredClone(DEFAULTS); S.settings = structuredClone(DEFAULTS);
const settingsDirty = () => JSON.stringify(S.settings) !== JSON.stringify(S.saved);
const sw = (path, on, label) => `<span class="switch"><input type="checkbox" role="switch" data-path="${path}" ${on ? 'checked' : ''} aria-label="${esc(label)}"><i></i></span>`;
const selectOpts = (path, val, opts, label, id = '') => `<select ${id ? `id="${id}"` : ''} data-path="${path}" ${label ? `aria-label="${esc(label)}"` : ''}>${opts.map(([v, l]) => `<option value="${v}" ${v === val ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
function fld(path, label, val, type, ac, help) {
  const id = 'f-' + path.replace('.', '-');
  return `<div class="field" id="w-${id}"><label for="${id}">${label}</label><input id="${id}" type="${type}" data-path="${path}" value="${esc(val)}" ${ac ? `autocomplete="${ac}"` : ''} aria-describedby="${help ? id + '-h ' : ''}${id}-e">
    ${help ? `<span class="help" id="${id}-h">${help}</span>` : ''}<span class="err" id="${id}-e"></span></div>`;
}
function renderSettings() {
  const v = $('#v-settings'), s = S.settings;
  const auto = (k, title, onFx, offFx, timing, first) => `<div class="tg ${first ? 'first' : ''}"><div class="tx"><b>${title}</b>
      <div class="fx"><em>${s.auto[k] ? 'On:' : 'Off:'}</em> ${s.auto[k] ? onFx : offFx}</div>
      <div class="sub-opts" ${s.auto[k] ? '' : 'hidden'}>${timing}</div></div>${sw('auto.' + k, s.auto[k], title)}</div>`;
  const appr = (k, title, first) => `<div class="tg ${first ? 'first' : ''}"><div class="tx"><b>Require approval: ${title.toLowerCase()}</b>
      <div class="fx">${s.approval[k] ? '<em>On:</em> staff must approve every message before it can be sent.' : '<em class="off">Off:</em> messages in this category can go out without a person checking them.'}</div></div>${sw('approval.' + k, s.approval[k], 'Require approval for ' + title.toLowerCase())}</div>`;
  v.innerHTML = `
    <div class="page-head"><div><h1 id="h-settings">Settings</h1><p class="sub">Set up your clinic and how the assistant works. Changes apply only after you save.</p></div></div>
    <form class="set-wrap" id="setForm" novalidate onsubmit="return false">
      <div class="saved-ok ${S.saveOk ? 'on' : ''}" role="status">${icon('check')} Settings saved.</div>

      <section class="card set-sec"><h2>${icon('building')} Clinic details</h2><p class="h-sub">Used by staff and when drafting messages.</p>
        <div class="two-col">${fld('clinic.name','Clinic name',s.clinic.name,'text','organization')}${fld('clinic.owner','Owner',s.clinic.owner,'text','name')}</div>
        ${fld('clinic.address','Address',s.clinic.address,'text','street-address')}
        <div class="two-col">${fld('clinic.phone','Contact phone',s.clinic.phone,'tel','tel-national','10-digit Indian mobile number')}${fld('clinic.email','Contact email',s.clinic.email,'email','email')}</div></section>

      <section class="card set-sec"><h2>${icon('globe')} Message language</h2><p class="h-sub">The language the assistant drafts in. Patients with a saved language of their own still get messages in that language.</p>
        <fieldset style="border:0"><legend class="sr">Preferred language</legend><div class="radios">
          ${[['English','English','Default'],['Hindi','हिन्दी','Hindi'],['Gujarati','ગુજરાતી','Gujarati']].map(([k, n, h]) => `<label class="radio"><input type="radio" name="lang" value="${k}" data-path="lang" ${s.lang === k ? 'checked' : ''}><span><b>${n}</b><small>${h}</small></span></label>`).join('')}
        </div></fieldset></section>

      <section class="card set-sec"><h2>${icon('plug')} WhatsApp Business connection</h2><p class="h-sub">How ClinicAI would reach your patients.</p>
        <div class="wa-status"><div class="wa-now"><h3><span class="chip c-warn">${icon('warn')} Demo connection</span> Not a real account</h3>
          <p style="font-size:14px;margin-top:6px">This prototype uses a simulated WhatsApp connection. Messages appear on screen only: nothing is sent to patients and nothing is received from them.</p>
          <p style="font-size:13.5px;margin-top:6px" class="mut">Business number: <b>Not linked</b></p>
          <button class="btn sec" type="button" disabled style="margin-top:10px">Connect real account (not available in prototype)</button></div>
        <div class="wa-states"><div><span class="chip c-warn">Demo</span><span>Simulated, with no real messages. <b>This is the current state.</b></span></div><div><span class="chip c-neutral">Not connected</span><span>No account is linked.</span></div><div><span class="chip c-ok">Connected</span><span>A verified WhatsApp Business account is linked and messages are really delivered.</span></div></div></div></section>

      <section class="card set-sec"><h2>${icon('bell')} Automated messages</h2><p class="h-sub">Choose which messages the assistant drafts, and when.</p>
        ${auto('noshow','No-show follow-ups','the AI drafts a follow-up when a patient misses an appointment.','missed appointments are not followed up.',
          `<div class="field"><label for="t-ns">Draft the follow-up</label>${selectOpts('timing.noshowDelay', s.timing.noshowDelay, [['30m','30 minutes after the missed slot'],['2h','2 hours after the missed slot'],['next','Next morning']], '', 't-ns')}</div>`, true)}
        ${auto('recall','Recall messages','the AI drafts a message when a patient is due for a repeat visit.','overdue patients are not contacted.',
          `<div class="field"><label for="t-rc">Recall interval</label>${selectOpts('timing.recallMonths', s.timing.recallMonths, [['3','Every 3 months'],['6','Every 6 months'],['12','Every 12 months']], '', 't-rc')}</div>`)}
        ${auto('reminder','Appointment reminders','the AI drafts a reminder before each appointment.','patients get no reminders, so no-shows may increase.',
          `<div class="field"><label for="t-rm">Reminder timing</label>${selectOpts('timing.reminderLead', s.timing.reminderLead, [['24h','24 hours before'],['2h','2 hours before'],['both','24 hours and 2 hours before']], '', 't-rm')}</div>`)}
      </section>

      <section class="card set-sec"><h2>${icon('shield')} Human approval</h2><p class="h-sub">We recommend keeping approval on. Turning it off lets the assistant message patients without staff review.</p>
        ${appr('noshow','No-show follow-ups', true)}${appr('recall','Recall messages')}${appr('reminder','Appointment reminders')}</section>

      <section class="card set-sec"><h2>${icon('clock')} Messaging hours</h2><p class="h-sub">Messages outside these hours wait for the next window. Times are in IST.</p>
        <div class="two-col">${fld('hours.start','Earliest time',s.hours.start,'time')}${fld('hours.end','Latest time',s.hours.end,'time')}</div>
        <div class="field"><span class="lbl" id="dlbl">Days we may message patients</span>
          <div class="days" role="group" aria-labelledby="dlbl">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<label><input type="checkbox" data-day="${d}" ${s.hours.days.includes(d) ? 'checked' : ''}><span>${d}</span></label>`).join('')}</div>
          <span class="help">Unselected days are skipped, and the AI won’t offer them as appointment slots.</span></div>
        <div class="field"><label for="cap">Messages per patient</label>${selectOpts('hours.cap', s.hours.cap, [['1','At most 1 per week'],['2','At most 2 per week'],['3','At most 3 per week']], '', 'cap')}
          <span class="help">Stops patients from feeling spammed.</span></div></section>
    </form>
    <div class="savebar ${settingsDirty() ? 'on' : ''}" id="savebar" role="region" aria-label="Save changes">
      <span class="msg-u"><i></i>Unsaved changes</span>
      <button class="btn ghost" type="button" id="cancelS">Cancel</button><button class="btn pri" type="button" id="saveS">Save changes</button></div>`;
  bindSettings(v);
  syncBadge();
}
const setP = (o, p, val) => { const k = p.split('.'), last = k.pop(); k.reduce((a, x) => a[x], o)[last] = val; };
function bindSettings(v) {
  const touch = () => { $('#savebar').classList.toggle('on', settingsDirty()); S.saveOk = false; $('.saved-ok', v).classList.remove('on'); };
  $$('input[data-path],select[data-path]', v).forEach(el => {
    const path = el.dataset.path, isChoice = el.type === 'checkbox' || el.type === 'radio' || el.tagName === 'SELECT';
    el.addEventListener(isChoice ? 'change' : 'input', async () => {
      if (el.type === 'checkbox') {
        if (path.startsWith('approval.') && !el.checked) {
          const k = path.split('.')[1];
          const ok = await dialog({title:'Turn off human approval?', danger:true, ok:'Turn off approval', cancel:'Keep approval on',
            body:`<p>Without approval, <b>${CAT[k].label.toLowerCase()}</b> messages could reach patients without a staff member reading them first.</p><p>AI can make mistakes, such as offering a day your clinic is closed. You can turn approval back on at any time.</p>`});
          if (!ok) { el.checked = true; return; }
        }
        setP(S.settings, path, el.checked); S.saveOk = false; renderSettings(); $(`[data-path="${path}"]`)?.focus(); return;
      }
      setP(S.settings, path, el.value); touch();
    });
  });
  $$('[data-day]', v).forEach(el => el.addEventListener('change', () => {
    const d = el.dataset.day, a = S.settings.hours.days;
    S.settings.hours.days = el.checked ? [...a, d] : a.filter(x => x !== d); touch();
  }));
  $('#cancelS').onclick = () => { S.settings = structuredClone(S.saved); renderSettings(); toast('Changes discarded.'); };
  $('#saveS').onclick = () => {
    const errs = validate(S.settings), keys = Object.keys(errs);
    $$('.field.bad', v).forEach(f => f.classList.remove('bad'));
    if (keys.length) {
      keys.forEach(k => { const id = 'f-' + k.replace('.', '-'); $('#w-' + id).classList.add('bad'); $('#' + id + '-e').textContent = errs[k]; });
      $('#f-' + keys[0].replace('.', '-')).focus(); toast('Fix the highlighted fields to save.'); return;
    }
    S.saved = structuredClone(S.settings); S.saveOk = true; renderSettings(); window.scrollTo({top:0, behavior:'smooth'}); toast('Settings saved.');
  };
}
function validate(s) {
  const e = {}, phone = s.clinic.phone.replace(/[\s-]/g, '').replace(/^(\+91|91(?=\d{10}$))/, '');
  if (!s.clinic.name.trim()) e['clinic.name'] = 'Enter the clinic name.';
  if (!s.clinic.owner.trim()) e['clinic.owner'] = 'Enter the owner’s name.';
  if (!/^[6-9]\d{9}$/.test(phone)) e['clinic.phone'] = 'Enter a valid 10-digit Indian mobile number.';
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s.clinic.email)) e['clinic.email'] = 'Enter a valid email address.';
  if (s.hours.start >= s.hours.end) e['hours.end'] = 'Latest time must be after the earliest time.';
  return e;
}
window.addEventListener('beforeunload', e => { if (settingsDirty()) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- boot ---------- */
if (!location.hash) history.replaceState(null, '', '#/inbox');
S.route = parseHash();
show();
</script>
